<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#14161c">
  <meta name="description" content="Bağlama için tarayıcıda çalışan, kurulum gerektirmeyen akort programı.">
  <title>Bağlama Akort</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Tema: kaydedilmiş seçim varsa ilk boyamadan önce uygula (yanıp sönmeyi önler). */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('baglama-tuner-settings') || '{}');
        if (s && (s.theme === 'dark' || s.theme === 'light')) {
          document.documentElement.setAttribute('data-theme', s.theme);
        }
      } catch (e) { /* yok say */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <noscript>
      <p class="boot-msg">Bu program JavaScript gerektirir. Lütfen tarayıcınızda JavaScript'i etkinleştirin.</p>
    </noscript>
    <p class="boot-msg" id="boot-msg">Yükleniyor…</p>
  </div>

  <script src="js/notes.js"></script>
  <script src="js/tunings.js"></script>
  <script src="js/pitch-detector.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/reference-tone.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
