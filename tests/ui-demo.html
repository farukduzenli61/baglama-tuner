<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#14161c">
  <title>Bağlama Akort — Arayüz Demosu (sahte veri)</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .demo-banner {
      max-width: 760px; margin: 10px auto 0; padding: 10px 14px;
      border: 1px dashed var(--accent); border-radius: 12px;
      font-size: 0.9rem; color: var(--text-2); background: var(--panel);
    }
    .demo-banner b { color: var(--accent); }
    .demo-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .demo-controls button {
      min-height: 40px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-2); cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="demo-banner">
    <b>DEMO</b> — Gerçek <code>js/ui.js</code> + <code>js/app.js</code>, sahte (mock) Notes / Tunings /
    AudioEngine / ReferenceTone ile. Mikrofon kullanılmaz; perde sinüs gibi salınır (±35 cent) ve
    birkaç saniyede bir başka tele geçer, arada kısa sessizlikler olur.
    <div class="demo-controls">
      <button type="button" id="demo-pause">Akışı duraklat</button>
      <button type="button" id="demo-silence">Sessizlik (3 sn)</button>
      <button type="button" id="demo-error">Hata göster: izin reddedildi</button>
      <button type="button" id="demo-bam">Bam teli (oktav pes) çal</button>
    </div>
  </div>
  <div id="app" class="app"><p class="boot-msg" id="boot-msg">Yükleniyor…</p></div>

  <!-- ===== Sahte modüller (sözleşmeye uygun) ===== -->
  <script>
  (function (B) {
    'use strict';
    var a4 = 440;
    var KOMA = 1200 / 53;
    var TR = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
    var EN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    function midiToFreq(m) { return a4 * Math.pow(2, (m - 69) / 12); }
    function freqToMidi(hz) { return 69 + 12 * Math.log(hz / a4) / Math.LN2; }
    function noteName(m, sys) { return (sys === 'en' ? EN : TR)[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }

    B.Notes = {
      NAMES_TR: TR, NAMES_EN: EN, KOMA_CENTS: KOMA,
      getA4: function () { return a4; },
      setA4: function (hz) { a4 = Math.max(415, Math.min(466, Number(hz) || 440)); },
      freqToMidi: freqToMidi, midiToFreq: midiToFreq, noteName: noteName,
      analyze: function (hz) {
        var f = freqToMidi(hz), m = Math.round(f), c = (f - m) * 100;
        return { hz: hz, midi: m, name: noteName(m, 'tr'), nameEn: noteName(m, 'en'),
                 octave: Math.floor(m / 12) - 1, cents: c, koma: c / KOMA };
      },
      centsBetween: function (hz, t) { return 1200 * Math.log(hz / t) / Math.LN2; }
    };

    // Sahte düzenler: midi pesten tize (alt, orta, üst)
    var DUZ = [
      { id: 'baglama', label: 'Bağlama Düzeni', description: 'La – Re – Sol (demo değerleri)', midi: [57, 50, 55] },
      { id: 'kara-duzen', label: 'Kara Düzen', description: 'Sol – Re – La (demo değerleri)', midi: [55, 50, 57] },
      { id: 'bozuk', label: 'Bozuk Düzen', description: 'La – Sol – Re (demo değerleri)', midi: [57, 55, 62] }
    ];
    var IDS = [['alt', 'Alt tel'], ['orta', 'Orta tel'], ['ust', 'Üst tel']];
    function course(m, isBam) { return { midi: m, hz: midiToFreq(m), noteName: noteName(m, 'tr'), isBam: isBam }; }

    B.Tunings = {
      INSTRUMENTS: [
        { id: 'kisa-sap', label: 'Kısa Sap Bağlama', description: 'Demo: kısa sap' },
        { id: 'uzun-sap', label: 'Uzun Sap Bağlama', description: 'Demo: uzun sap' },
        { id: 'divan', label: 'Divan Sazı', description: 'Demo: bir oktav pes', octaveShift: -12 },
        { id: 'cura', label: 'Cura', description: 'Demo: bir oktav tiz', octaveShift: 12 }
      ],
      DUZENLER: DUZ,
      getStrings: function (instrumentId, duzenId, transpose) {
        var d = DUZ.filter(function (x) { return x.id === duzenId; })[0] || DUZ[0];
        var ins = B.Tunings.INSTRUMENTS.filter(function (x) { return x.id === instrumentId; })[0] || {};
        var shift = (ins.octaveShift || 0) + (transpose || 0);
        return d.midi.map(function (m0, i) {
          var m = m0 + shift;
          var courses = [course(m, false), course(m, false)];
          if (i === 0) courses.push(course(m - 12, true));    // alt telde bam teli
          return { id: IDS[i][0], label: IDS[i][1], midi: m, hz: midiToFreq(m), noteName: noteName(m, 'tr'), courses: courses };
        });
      },
      findClosestString: function (hz, strings) {
        var best = null;
        strings.forEach(function (s) {
          var c = B.Notes.centsBetween(hz, s.hz);
          // oktav farkını katla
          var folded = c - 1200 * Math.round(c / 1200);
          var score = Math.abs(folded) + Math.abs(Math.round(c / 1200)) * 30;
          if (!best || score < best.score) best = { string: s, cents: folded, score: score };
        });
        return best ? { string: best.string, cents: best.cents } : null;
      },
      makeCustom: function (label, midiList) { return { id: 'custom', label: label, midi: midiList }; }
    };

    // Sahte ses motoru
    var pitchCbs = [], levelCbs = [], errorCbs = [];
    var running = false, timer = 0, t0 = 0, paused = false, silenceUntil = 0, forceBam = 0;
    function emit(list, v) { list.forEach(function (f) { try { f(v); } catch (e) { console.error(e); } }); }
    function tick() {
      if (!running) return;
      var t = (performance.now() - t0) / 1000;
      var strings = B.Tunings.getStrings(B.App.getSettings().instrumentId, B.App.getSettings().duzenId, B.App.getSettings().transpose);
      if (paused) { timer = requestAnimationFrame(tick); return; }
      var phase = t % 9;                         // 9 sn'lik döngü: 7.5 sn ses + 1.5 sn sessizlik
      var silent = phase > 7.5 || performance.now() < silenceUntil;
      if (silent) {
        emit(levelCbs, 0.002 + Math.random() * 0.002);
        emit(pitchCbs, null);
      } else {
        var idx = Math.floor(t / 9) % strings.length;
        var s = strings[idx];
        var cents = 35 * Math.sin(t * 0.9) * Math.max(0.05, 1 - phase / 7.5) + (Math.random() - 0.5) * 0.8;
        var base = s.hz;
        if (performance.now() < forceBam && s.courses) {
          var bam = s.courses.filter(function (c) { return c.isBam; })[0];
          if (bam) base = bam.hz;
        }
        var hz = base * Math.pow(2, cents / 1200);
        var rms = 0.25 * Math.exp(-phase / 3) + 0.01;
        emit(levelCbs, rms);
        emit(pitchCbs, { hz: hz, clarity: 0.95, rms: rms, stable: Math.abs(Math.cos(t * 0.9)) < 0.3 });
      }
      timer = requestAnimationFrame(tick);
    }
    B.AudioEngine = {
      start: function () {
        return new Promise(function (res) {
          setTimeout(function () { running = true; t0 = performance.now(); tick(); res(); }, 300);
        });
      },
      stop: function () { running = false; cancelAnimationFrame(timer); },
      isRunning: function () { return running; },
      getContext: function () { return null; },
      onPitch: function (cb) { pitchCbs.push(cb); },
      onLevel: function (cb) { levelCbs.push(cb); },
      onError: function (cb) { errorCbs.push(cb); },
      setSmoothing: function () {},
      _demo: {
        togglePause: function () { paused = !paused; return paused; },
        silence: function () { silenceUntil = performance.now() + 3000; },
        bam: function () { forceBam = performance.now() + 4000; },
        error: function () { emit(errorCbs, { code: 'denied', message: 'Demo: izin reddedildi' }); }
      }
    };

    var playingUntil = 0;
    B.ReferenceTone = {
      play: function (hz, opts) {
        playingUntil = performance.now() + 1500;
        console.log('[Demo] ReferenceTone.play', hz.toFixed(2), opts || {});
      },
      stop: function () { playingUntil = 0; },
      isPlaying: function () { return performance.now() < playingUntil; }
    };
    B.PitchDetector = { detect: function () { return null; } };
  })(window.Baglama = window.Baglama || {});
  </script>

  <!-- ===== Gerçek arayüz ===== -->
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>

  <script>
  window.addEventListener('load', function () {
    var D = window.Baglama.AudioEngine._demo;
    document.getElementById('demo-pause').onclick = function () {
      this.textContent = D.togglePause() ? 'Akışı sürdür' : 'Akışı duraklat';
    };
    document.getElementById('demo-silence').onclick = D.silence;
    document.getElementById('demo-error').onclick = D.error;
    document.getElementById('demo-bam').onclick = D.bam;
    // Demo: mikrofonu kendiliğinden "aç"
    var btn = document.getElementById('mic-btn');
    if (btn) btn.click();
  });
  </script>
</body>
</html>
